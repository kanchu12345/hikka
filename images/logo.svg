<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Wave Gradients -->
    <linearGradient id="waveOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="waveInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Left Side: Circular Barrel Wave with Surfer -->
  <g transform="translate(10, 5)">
    <!-- Outer Wave Curl -->
    <path d="M 80 145 C 30 145, 5 110, 5 75 C 5 35, 35 5, 80 5 C 115 5, 140 25, 145 55 C 145 70, 135 85, 120 85 C 110 85, 105 75, 110 65 C 115 55, 110 35, 85 30 C 60 25, 35 45, 35 75 C 35 105, 55 125, 85 125 C 110 125, 125 110, 130 95 C 132 115, 115 145, 80 145 Z" fill="url(#waveOuter)" />

    <!-- Secondary Wave Layer -->
    <path d="M 80 135 C 45 135, 20 110, 20 75 C 20 45, 45 20, 80 20 C 105 20, 125 35, 130 60 C 130 70, 122 75, 115 75 C 108 75, 102 68, 105 58 C 108 45, 95 35, 80 35 C 55 35, 42 55, 42 75 C 42 98, 58 115, 80 115 C 98 115, 112 102, 118 88 C 115 110, 100 135, 80 135 Z" fill="url(#waveInner)" />

    <!-- Wave Crest Foam Highlight -->
    <path d="M 85 10 C 120 10, 148 32, 148 60 C 148 72, 138 88, 120 88 C 108 88, 104 74, 112 62 C 118 52, 110 25, 85 20 C 78 18, 70 20, 65 24 C 70 15, 78 10, 85 10 Z" fill="#e0f2fe" opacity="0.9" />

    <!-- Surfer Riding Wave -->
    <!-- Board -->
    <path d="M 45 106 C 55 100, 75 97, 95 98 C 100 98, 104 100, 102 103 C 98 106, 75 108, 55 112 C 48 113, 42 110, 45 106 Z" fill="#0369a1" />
    
    <!-- Surfer Silhouette -->
    <!-- Head -->
    <circle cx="68" cy="65" r="4.5" fill="#0369a1" />
    <!-- Torso & Arms in Surf Stance -->
    <path d="M 68 70 L 65 80 L 58 88 L 62 89 L 69 82 L 74 88 L 78 86 L 72 78 L 72 70 Z" fill="#0369a1" />
    <!-- Back Arm / Balance -->
    <path d="M 65 72 L 54 70 L 53 72 L 64 76 Z" fill="#0369a1" />
    <!-- Front Arm -->
    <path d="M 70 73 L 82 72 L 83 75 L 71 77 Z" fill="#0369a1" />
    <!-- Legs / Knees bent -->
    <path d="M 65 80 L 56 94 L 52 104 L 57 105 L 62 96 L 68 82 Z" fill="#0369a1" />
    <path d="M 72 78 L 78 92 L 85 101 L 90 100 L 82 90 L 74 80 Z" fill="#0369a1" />
  </g>

  <!-- Right Side: Brand Text -->
  <g transform="translate(170, 20)">
    <!-- THE / HIKKA -->
    <text x="0" y="45" font-family="'Playfair Display', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#0284c7" letter-spacing="3">
      HIKKA
    </text>

    <!-- SURF -->
    <text x="0" y="95" font-family="'Playfair Display', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#082f49" letter-spacing="4">
      SURF
    </text>

    <!-- SURF SCHOOL • SRI LANKA Subtitle -->
    <line x1="0" y1="110" x2="310" y2="110" stroke="#0284c7" stroke-width="2" opacity="0.6" />
    <text x="2" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#d97706" letter-spacing="3.5">
      SURF SCHOOL • SRI LANKA
    </text>
  </g>
</svg>
