<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Wave Gradients -->
    <linearGradient id="waveCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <linearGradient id="waveGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <style>
      @keyframes logoWaveBob {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(-1.5deg); }
      }
      @keyframes logoSurferGlide {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(1px, -2px) rotate(-2deg); }
        75% { transform: translate(-1px, 1px) rotate(1.5deg); }
      }
      @keyframes foamPulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #ffffff); }
      }
      .anim-wave {
        animation: logoWaveBob 4s ease-in-out infinite;
        transform-origin: 75px 80px;
      }
      .anim-surfer {
        animation: logoSurferGlide 3s ease-in-out infinite;
        transform-origin: 75px 85px;
      }
      .anim-foam {
        animation: foamPulse 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Left: Circular Wave with Surfer (Exact Match to User's SVG Icon) -->
  <g class="anim-wave" transform="translate(10, 8)">
    
    <!-- Outer Cyan/Blue Wave Barrel Circle -->
    <path d="M 75 142 C 38 142, 8 112, 8 75 C 8 38, 38 8, 75 8 C 108 8, 134 28, 142 58 C 144 68, 138 78, 126 78 C 116 78, 110 70, 114 60 C 118 48, 102 24, 75 24 C 47 24, 25 47, 25 75 C 25 103, 47 126, 75 126 C 98 126, 118 112, 122 96 C 124 116, 105 142, 75 142 Z" fill="url(#waveCyanGrad)" />

    <!-- Inner Ocean Swirl -->
    <path d="M 75 130 C 44 130, 20 105, 20 75 C 20 48, 42 26, 70 26 C 92 26, 112 40, 118 60 C 114 42, 96 36, 78 36 C 54 36, 35 53, 35 75 C 35 97, 53 115, 75 115 C 92 115, 108 104, 114 90 C 108 112, 94 130, 75 130 Z" fill="url(#waveGlow)" opacity="0.85" />

    <!-- Crashing White Wave Lip / Crest (Right Top Curve) -->
    <path class="anim-foam" d="M 108 18 C 128 24, 145 42, 145 64 C 145 82, 132 94, 120 94 C 110 94, 108 84, 116 72 C 124 60, 122 36, 98 22 C 102 19, 105 18, 108 18 Z" fill="#ffffff" />
    
    <!-- White Water Droplet Accent -->
    <circle cx="132" cy="30" r="3.5" fill="#bae6fd" />
    <circle cx="140" cy="42" r="2.5" fill="#ffffff" />

    <!-- Standing Surfer inside the Wave Tunnel -->
    <g class="anim-surfer">
      <!-- White Surfboard -->
      <path d="M 44 112 C 54 106, 78 104, 104 106 C 109 106, 112 108, 110 111 C 106 114, 78 117, 54 120 C 46 121, 41 117, 44 112 Z" fill="#ffffff" />

      <!-- Surfer Head -->
      <circle cx="75" cy="65" r="5" fill="#ffffff" />

      <!-- Surfer Body / Arms / Surf Stance -->
      <!-- Arms spread for balance -->
      <path d="M 58 74 L 75 75 L 92 73" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Torso -->
      <path d="M 75 70 L 75 88" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- Bent Knees / Wide Surfing Stance -->
      <path d="M 75 88 L 62 100 L 58 111" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M 75 88 L 88 100 L 96 108" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>

  <!-- Right: Bold Typographic Identity (Exact Match to Image) -->
  <g transform="translate(175, 18)">
    
    <!-- HIKKA (Bold Electric Light Blue) -->
    <text x="0" y="46" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="46" fill="#38bdf8" letter-spacing="3.5">
      HIKKA
    </text>

    <!-- SURF (Bold Solid White) -->
    <text x="0" y="98" font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="54" fill="#ffffff" letter-spacing="4">
      SURF
    </text>

    <!-- Horizontal Divider Line -->
    <line x1="0" y1="114" x2="330" y2="114" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" />

    <!-- SURF SCHOOL • SRI LANKA (Golden Yellow) -->
    <text x="2" y="132" font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13.5" fill="#f59e0b" letter-spacing="4">
      SURF SCHOOL • SRI LANKA
    </text>
  </g>
</svg>
